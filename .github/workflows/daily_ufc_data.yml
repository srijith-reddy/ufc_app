name: Daily UFC Cards & Odds Scrape

on:
  schedule:
    - cron: "0 6 * * *"   # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      event_number:
        description: "Optional event ref (e.g. 324 or ufc-fight-night-emmett-vs-vallejos)"
        required: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-scrape.txt
          # Install the browser binary
          playwright install chromium
          # Install OS-level system libs that Chromium requires on Ubuntu.
          # Without this step, chromium.launch() raises an immediate error:
          #   "Host system is missing dependencies to run browsers"
          playwright install-deps chromium

      - name: Scrape UFC fight card
        # On daily schedule: discovers and refreshes the next few upcoming UFC
        # event cards, including Fight Nights.
        # On manual dispatch: refreshes the specific event ref provided.
        run: |
          if [ -z "${{ github.event.inputs.event_number }}" ]; then
            python scrape_cards.py
          else
            python scrape_cards.py "${{ github.event.inputs.event_number }}"
          fi

      - name: Scrape UFC odds
        # On daily schedule: auto-detects the next upcoming event.
        # On manual dispatch with event_number: scrapes that specific event.
        # continue-on-error so a transient network/site failure doesn't
        # block the commit step for any data that did change.
        continue-on-error: true
        run: |
          if [ -z "${{ github.event.inputs.event_number }}" ]; then
            python scrape_odds.py
          else
            python scrape_odds.py "${{ github.event.inputs.event_number }}"
          fi

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cards/ odds/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update UFC cards & odds [skip ci]"

          # Fetch + rebase to handle concurrent pushes cleanly
          git fetch origin main
          git rebase origin/main
          git push origin main
