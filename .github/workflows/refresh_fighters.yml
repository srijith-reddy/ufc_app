name: Refresh Raw Data And Model Artifacts

on:
  # Monthly full refresh on the 1st at 08:00 UTC.
  schedule:
    - cron: "0 8 1 * *"

  workflow_dispatch:
    inputs:
      tune_trials:
        description: "Optuna trial count (0 = use baked-in defaults)"
        required: false
        default: "25"
      full_raw:
        description: "Run a full raw UFCStats rebuild instead of incremental"
        required: false
        type: boolean
        default: false

concurrency:
  group: refresh-fighters
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          cache: "pip"
          python-version: "3.11"

      - name: Restore cached raw UFCStats bundle
        uses: actions/cache@v4
        with:
          path: data/raw/ufcstats
          key: ufcstats-raw-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ufcstats-raw-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-scrape.txt

      - name: Resolve workflow inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "tune_trials=25" >> "$GITHUB_OUTPUT"
            echo "full_raw=false" >> "$GITHUB_OUTPUT"
          else
            echo "tune_trials=${{ github.event.inputs.tune_trials }}" >> "$GITHUB_OUTPUT"
            echo "full_raw=${{ github.event.inputs.full_raw }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run raw UFCStats refresh
        run: |
          EXTRA_ARGS=""
          if [ "${{ steps.inputs.outputs.full_raw }}" = "true" ]; then
            EXTRA_ARGS="--full"
          fi
          python -m pipelines.scrape_ufcstats all $EXTRA_ARGS

      - name: Train and export model artifacts
        run: |
          python -m pipelines.train_model \
            --data-dir data/raw/ufcstats \
            --tune-trials "${{ steps.inputs.outputs.tune_trials }}"

      - name: Open refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh UFC raw data + model artifacts [skip ci]"
          title: "chore: refresh UFC raw data + model artifacts"
          body: |
            ## Summary
            - refresh raw UFCStats CSVs
            - retrain and export model artifacts

            This PR was created automatically by `refresh_fighters.yml`.
          branch: automation/refresh-ufc-data
          delete-branch: true
          add-paths: |
            data/raw/ufcstats
            models
