name: Refresh Raw Data And Model Artifacts

on:
  # Monthly full refresh on the 1st at 08:00 UTC.
  schedule:
    - cron: "0 8 1 * *"

  workflow_dispatch:
    inputs:
      tune_trials:
        description: "Optuna trial count (0 = use baked-in defaults)"
        required: false
        default: "0"
      full_raw:
        description: "Run a full raw UFCStats rebuild instead of incremental"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-scrape.txt

      - name: Resolve workflow inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "tune_trials=0" >> "$GITHUB_OUTPUT"
            echo "full_raw=false" >> "$GITHUB_OUTPUT"
          else
            echo "tune_trials=${{ github.event.inputs.tune_trials }}" >> "$GITHUB_OUTPUT"
            echo "full_raw=${{ github.event.inputs.full_raw }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run raw UFCStats refresh
        run: |
          EXTRA_ARGS=""
          if [ "${{ steps.inputs.outputs.full_raw }}" = "true" ]; then
            EXTRA_ARGS="--full"
          fi
          python -m pipelines.scrape_ufcstats all $EXTRA_ARGS

      - name: Train and export model artifacts
        run: |
          python -m pipelines.train_model \
            --data-dir data/raw/ufcstats \
            --tune-trials "${{ steps.inputs.outputs.tune_trials }}"

      - name: Commit and push refreshed data/artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/ufcstats/ models/

          if git diff --cached --quiet; then
            echo "No raw/model changes to commit"
            exit 0
          fi

          MONTH=$(date +%Y-%m)
          git commit -m "chore: refresh UFC raw data + model artifacts ${MONTH} [skip ci]"

          git fetch origin main
          git rebase origin/main
          git push origin main
